<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="ABADDON - A melhor loja de softwares confiáveis do mercado">
    <title>Abaddon Studio</title>

    <link rel="icon" href="images/png.png" type="image/png">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/abaddon.css">
</head>
<body>
    <div id="video-background" aria-hidden="true">
        <video id="background-video" autoplay muted playsinline preload="auto"></video>
        <audio id="background-music" preload="auto" loop>
            <source src="media/music.mp3" type="audio/mpeg">
        </audio>
    </div>
    <div class="background-shade" aria-hidden="true"></div>

    <button id="enter-screen" class="enter-screen" type="button" aria-label="Entrar no site">
        <div class="enter-content">
            <div class="metal-icon" aria-hidden="true">
                <svg viewBox="0 0 96 112" role="img" focusable="false">
                    <path d="M48 4 77 17 90 46 82 83 62 105H34L14 83 6 46 19 17Z"/>
                    <path d="M24 38 39 31 42 52 27 55Z" class="cut"/>
                    <path d="M72 38 57 31 54 52 69 55Z" class="cut"/>
                    <path d="M31 69 42 63 45 91 36 86Z" class="cut"/>
                    <path d="M65 69 54 63 51 91 60 86Z" class="cut"/>
                    <path d="M48 57 55 72 48 78 41 72Z" class="cut"/>
                    <path d="M18 24 29 18 34 31 22 35Z" class="groove"/>
                    <path d="M78 24 67 18 62 31 74 35Z" class="groove"/>
                </svg>
            </div>
            <div class="enter-title">ABADDON STUDIO</div>
            <div class="enter-subtitle">CLIQUE PARA ENTRAR</div>
        </div>
    </button>

    <main class="page-shell">
        <section class="profile-card" id="profile-card">
            <div class="avatar-wrap">
                <img class="profile-avatar" src="images/png.png" alt="ABADDON">
            </div>

            <h1>ABADDON</h1>
            <p class="tagline">A melhor loja de softwares confiáveis do mercado</p>

            <div class="divider"></div>

            <a class="discord-button" href="https://discord.gg/fw3BWDb27N" target="_blank" rel="noopener noreferrer" aria-label="Entrar no Discord da ABADDON">
                <i class="fab fa-discord" aria-hidden="true"></i>
                <span>Entrar no Discord</span>
            </a>
        </section>
    </main>

    <script src="js/x.js"></script>
    <script src="js/sparkles-clean.js"></script>
    <script src="js/abaddon.js"></script>
</body>
</html>
